server.port=9095
server.servlet.context-path=/log
spring.banner.charset=utf-8

# 激活的 profile。
#   dev   -> SQLite，单机/开发（当前默认，建表脚本 demo.sql）
#   mysql -> MySQL 8（建表脚本 demo-mysql8.sql，见 application-mysql.properties）
#   prd   -> 见 application-prd.properties
# 注意这里写的是"默认值"：命令行 -Dspring.profiles.active=mysql 会把它整个替掉，
# 不是叠加，所以各 profile 必须自带完整的数据源配置（见下方"数据库"一节）。
spring.profiles.active=dev

# 日志后端统一走 Log4j2，配置见 src/main/resources/log4j2.xml
logging.config=classpath:log4j2.xml

# 会话不持久化：页面里的 SSH 通道、终端 token 都是内存态，跨重启恢复没有意义，
# 反而会让「重启后旧标签页还连着一台已经不存在的机器」这种问题出现
server.servlet.session.persistent=false

# ---------------------------------------------------------------
# 数据库：基础设施配置与数据源分开写
#
# 应用要同时能跑 SQLite 和 MySQL 8，而这两种库的**连接层**差异没法用同一组配置表达：
#   - SQLite 是文件库，URL 里没有主机/账号，且需要 PRAGMA 之类的连接级设置；
#   - MySQL 需要主机、库名、账号口令，以及 UTF-8 相关的一串 URL 参数。
# 所以：
#   本文件只放两边共用的部分（连接池大小、MyBatis 配置）；
#   每个 profile 各自放完整数据源，见 application-dev.properties / application-mysql.properties。
#
# ---------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:demo.db?busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite 是「单写多读」：同一时刻只允许一个写事务，其余写入必须排队。
# 池子开大不会提升写吞吐，只会让锁竞争更激烈，8 个连接足够页面并发。
# MySQL 那边是客户端/服务端模型，没有这个限制，池子大小单独在 mysql profile 里给。
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=300MB
# journal_mode=WAL 是数据库级的持久设置（写进 db 文件头，执行一次即长期生效），
# 所以在代码里启动时执行一次即可。见 com.sl.config.DbInitializer#enableWal()
# 注意：MySQL 那边不执行，也没有对应物。

# ---------------------------------------------------------------
# MyBatis-Plus
# 方言（分页 SQL 的写法）不在这里配：PaginationInnerInterceptor 会从连接 URL 自动判定，
# 见 com.sl.config.MybatisPlusConfig。换库不用改配置也不用改代码。
#
# 全局 settings 走 XML（这才是"唯一数据源"的地方，别在这儿再用 mybatis-plus.configuration.*
# 重复声明同名项 —— MyBatis 对同一个 core setting 同时来自 configLocation 和 properties 会报错）。
# 里头的 callSettersOnNulls=true 必须留着：默认 false 时，列值为 NULL 的字段不会调用 setter，
# 实体对象保留 Java 默认值（boolean 就成了 false），"没填"和"填了 false"分不出来。
# localCacheScope=STATEMENT 同样关键，理由见 MybatisPlusConfig 的类注释。
#
# ⚠ 这行曾经只在 MybatisPlusConfig 的注释里写着，配置里根本没写 —— 等于 XML 从来没被加载过，
# 上面那些 setting 全部没生效。改动这一块时记得顺手确认这行还在。
# ---------------------------------------------------------------
mybatis-plus.config-location=classpath:dataAccessConfiguration.xml
spring-boot.run.main-class=com.sl.Application
# ---------------------------------------------------------------
# Vaadin
# ---------------------------------------------------------------
# 生产模式不在这里开关：开发用默认的 spring-boot:run（Vite dev server 实时编译），
# 打包用 mvn -Pproduction package。写 vaadin.servlet.production-mode 是 Vaadin 8 的
# 属性，Vaadin 24 不认，留着只会误导人。

# ---------------------------------------------------------------
# 文件管理：允许在线编辑的纯文本文件（见 com.sl.config.PureTextProperties）
# type      = 扩展名白名单，逗号分隔，不区分大小写
# maxsize   = 大小上限，支持 B/K/M/G 后缀（如 10M、512K、1G），不带后缀按字节算
# ---------------------------------------------------------------
pure.text.type=text,markdown,md,yml,yaml,conf,ini,log,csv,properties,sql,xml,html
pure.text.type.maxsize=10M
