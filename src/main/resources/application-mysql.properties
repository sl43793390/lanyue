# ---------------------------------------------------------------
# MySQL 8 profile
#
# 启用方式（会整个替换掉 application.properties 里的 spring.profiles.active=dev）：
#   java -jar lanyue.jar --spring.profiles.active=mysql
#   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=mysql
#
# 建表脚本见 src/main/resources/demo-mysql8.sql（不是 demo.sql，那个是 SQLite 的）。
# 从 SQLite 迁数据不是"改个 URL"就完事，见文件末尾的迁移清单。
# ---------------------------------------------------------------

# MySQL 8 必须用 com.mysql.cj.jdbc.Driver。老代码里的 com.mysql.jdbc.Driver 在 Connector/J 8 之后
# 只是个会打印告警的空壳，9.x 已经彻底没有了。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 逐个参数说明（对照 mysql-connector-j 9.2.0 的 PropertyKey，Boot 3.5.0 锁的就是这个版本）：
#   characterEncoding=UTF-8
#       让驱动用 UTF-8 编解码。⚠ 它**不等于** utf8mb4：服务端的库/表字符集是不是 utf8mb4
#       要单独确认（DbInitializer 启动时会查 @@character_set_database 并告警）。
#       MySQL 的 "utf8" 是 utf8mb3，最多 3 字节，存不下 emoji 和部分增补平面汉字。
#   connectionTimeZone=Asia/Shanghai
#       驱动认识的属性名是 connectionTimeZone；serverTimezone 是它的**弃用别名**
#       （源码里写作 connectionTimeZone("connectionTimeZone", "serverTimezone", true)，
#       第二个参数就是旧名）。用新名，避免以后升级驱动时告警甚至失效。
#       本项目的日期列存的是 yyyy-MM-dd HH:mm:ss 文本，时区只影响 JDBC 会话，不影响存量数据。
#   sslMode=DISABLED + allowPublicKeyRetrieval=true
#       MySQL 8 默认认证插件是 caching_sha2_password：不走 SSL 时，客户端拿不到服务端公钥就无法完成
#       首次认证，会报 "Public Key Retrieval is not allowed"。内网部署可以直接关 SSL + 允许取公钥；
#       走公网的话请改成 sslMode=REQUIRED / VERIFY_CA，并把 allowPublicKeyRetrieval 去掉。
#   rewriteBatchedStatements=true
#       把批量 INSERT 合并成多值语句。MyBatis-Plus 的 saveBatch 在没这个参数时是一条一条发的。
#   useInformationSchema=true
#       DatabaseMetaData 走 information_schema 而不是 SHOW 语句，结果更准（带注释、默认值）。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lanyue?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&useInformationSchema=true

spring.datasource.username=lanyue
spring.datasource.password=

# MySQL 是客户端/服务端模型，没有 SQLite 那种"单写多读"的写锁限制，池子可以按并发给大一些。
# 但仍要留意 max-lifetime 与 MySQL 的 wait_timeout 的关系：默认 max-lifetime 是 30 分钟，
# MySQL 默认 wait_timeout 是 8 小时（28800s），30 分钟远小于它，所以不会出现
# "连接被服务端悄悄关掉、下次取出来用才报 CommunicationsException"的情况。
# —— 这正是旧 riskmaster 项目在 Apache Commons DBCP 上踩过的坑：DBCP 默认不管空闲连接的存活，
# 必须靠 validationQuery + testWhileIdle 兜。HikariCP 自己会按 max-lifetime 回收，不需要额外配。
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=4

# ---------------------------------------------------------------
# 从 SQLite 迁到 MySQL 的清单（顺序不能乱）
# ---------------------------------------------------------------
# 1. 建库建账号，字符集必须是 utf8mb4：
#      CREATE DATABASE lanyue DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
#      CREATE USER 'lanyue'@'%' IDENTIFIED BY '<口令>';
#      GRANT ALL PRIVILEGES ON lanyue.* TO 'lanyue'@'%';
#    MySQL 8 的建库默认字符集已经是 utf8mb4，但生产环境常被显式加成 utf8，所以照样写死。
#
# 2. 执行建表脚本：mysql -u lanyue -p lanyue < src/main/resources/demo-mysql8.sql
#
# 3. 导数据。这一步**不能用 SQLite 的 .dump 直接灌**：demo.sql 里的
#    datetime('now','localtime') / date('now','+90 day') 是 SQLite 函数，
#    双引号标识符在 MySQL 里是字符串字面量，INSERT OR IGNORE 也不是 MySQL 语法。
#    可行做法是用 INSERT ... SELECT 逐表搬，或让应用先连 SQLite 导出 CSV 再 LOAD DATA。
#    数据量很小（users / connection_info / common_project_mgmt 都是个位数到十位数），手搬也行。
#
# 4. 改本文件的 url/username/password，然后 --spring.profiles.active=mysql 启动。
#
# 5. 启动日志里确认这几行（DbInitializer 会打）：
#      "检测到数据库：MySQL 8.0.x（MySQL）"
#      "MySQL 字符集：库=utf8mb4（utf8mb4_0900_ai_ci）客户端=utf8mb4 连接=utf8mb4"
#    少了或者值是 utf8mb3，就是第 1 步没做对。
#
# 6. 密码不用管：库里存的是 SM3 或 BCrypt 摘要，跟数据库无关，
#    登录一次就会自动从 SM3 升级成 BCrypt（见 SecurityConfig 的渐进式迁移）。
